---
layout: default
---
<article class="wrap article-shell">
  <a class="text-link" href="{{ '/blog/' | relative_url }}">← All news & notes</a>
  <header class="page-heading"><p class="eyebrow">{{ page.category | default: 'Research note' }} <span class="separator">/</span> <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%d %B %Y' }}</time></p><h1>{{ page.title }}</h1>{% if page.subtitle %}<p class="page-intro">{{ page.subtitle }}</p>{% endif %}</header>
  <div class="prose">{{ content }}</div>
</article>
