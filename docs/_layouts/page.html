---
layout: default
---
<div class="wrap page-shell page-{{ page.nav | escape }}">
  <header class="page-heading{% if page.intro_wide %} page-heading-wide{% endif %}"><p class="eyebrow">{{ page.eyebrow | default: 'Rodrigo Vicente' }}</p><h1>{{ page.title }}</h1>{% if page.intro %}<p class="page-intro">{{ page.intro }}</p>{% endif %}</header>
  <div class="page-content">{{ content }}</div>
</div>
